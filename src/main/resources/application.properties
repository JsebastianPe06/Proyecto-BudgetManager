spring.application.name=BudgetManager

# SQLite
spring.datasource.url=jdbc:sqlite:budgetmanager.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Semillas
app.seed.admin.email=admin@unal.edu.co
app.seed.admin.password=Admin1234

logging.level.org.springframework.security=DEBUG
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

server.port=8080
app.backup.dir=./backups