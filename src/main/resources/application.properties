spring.application.name=BudgetManager

# Conexión a archivo SQLite local
spring.datasource.url=jdbc:sqlite:data/presupuesto.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL;

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration