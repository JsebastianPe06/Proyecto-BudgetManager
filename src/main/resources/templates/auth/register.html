<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img th:src="@{/images/logo.svg}" alt="Logo" width="48" height="48">
                <h2>Crear Cuenta</h2>
                <p class="text-muted">Comienza a gestionar tus finanzas</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/auth/register}" th:object="${form}" method="post">
                <input th:replace="~{fragments/layout :: csrf}"/>
                
                <div class="form-group">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Tu nombre">
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="tu@correo.com">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Mínimo 8 caracteres">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repite la contraseña">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></span>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
