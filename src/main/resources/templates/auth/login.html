<p th:if="${param.registered}">Cuenta creada. Ya puedes iniciar sesión.</p>
<p th:if="${param.error}">Credenciales inválidas o cuenta bloqueada</p>
<p th:if="${param.logout}">Has cerrado sesión.</p>

<form th:action="@{/login}" method="post">
  <!-- ESTA ES LA LÍNEA MÁGICA QUE FALTABA -->
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  
  <input name="username" type="email" placeholder="Correo" required/>
  <input name="password" type="password" placeholder="Contraseña" required/>
  <button type="submit">Ingresar</button>
  <a th:href="@{/auth/register}">Crear cuenta</a>
</form>
