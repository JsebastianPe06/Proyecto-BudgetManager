<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Nueva Transacción</title></head>
<body>
  <h1>Registrar Transacción</h1>

  <!-- El form debe envolver TODO, incluyendo los mensajes de error -->
  <form th:action="@{/transactions/new}" th:object="${form}" method="post">
    
    <!-- Token CSRF -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Mensaje de error de negocio (ej. saldo insuficiente) -->
    <p th:if="${error}" th:text="${error}" style="color: red; font-weight: bold;"></p>

    <!-- Errores de validación de campos (ahora sí, dentro del form) -->
    <div th:if="${#fields.hasAnyErrors()}" style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px;">
        <strong>Por favor corrige los siguientes errores:</strong>
        <ul>
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
        </ul>
    </div>

    <label>Tipo: 
      <select th:field="*{type}">
        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
      </select>
    </label><br><br>

    <label>Monto: 
      <input th:field="*{amount}" type="number" step="0.01" required/>
      <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:red;"></span>
    </label><br><br>

    <label>Categoría: 
      <select th:field="*{category}">
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
      </select>
    </label><br><br>

    <label>Prioridad: 
      <select th:field="*{priority}">
        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
      </select>
    </label><br><br>

    <label>Fecha: 
      <!-- El required asegura que el navegador no envíe vacío -->
      <input type="date" th:field="*{transactionDate}" required/>
      <span th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}" style="color:red;"></span>
    </label><br><br>

    <label>
      <input type="checkbox" th:field="*{planned}"/> 
      Es un gasto planificado (aún no realizado)
    </label><br><br>

    <button type="submit">Guardar</button>
    <a th:href="@{/transactions}">Cancelar</a>
  </form>
</body>
</html>
