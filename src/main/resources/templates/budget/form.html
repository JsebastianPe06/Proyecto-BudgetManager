<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Nuevo Presupuesto</title></head>
<body>
  <h1>Configurar Presupuesto Mensual</h1>
  <p th:if="${error}" th:text="${error}" style="color: red;"></p>

  <form th:action="@{/budget/new}" th:object="${form}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Mes (1-12): <input th:field="*{month}" type="number" min="1" max="12"/></label><br><br>
    <label>Año: <input th:field="*{year}" type="number"/></label><br><br>
    <label>Monto Total para el mes: <input th:field="*{totalAmount}" type="number" step="0.01"/></label><br><br>

    <button type="submit">Guardar Presupuesto</button>
    <a th:href="@{/budget}">Cancelar</a>
  </form>
</body>
</html>
