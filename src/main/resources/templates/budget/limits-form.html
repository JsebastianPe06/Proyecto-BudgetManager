<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Límites por Categoría')}"></head>
<body>
    <div th:replace="~{fragments/layout :: layout('Definir Límite por Categoría', ~{::main-content})}">
        <main-content>
            <div class="card" style="max-width: 600px;">
                <p class="text-muted mb-4">Presupuesto de <strong th:text="|${mes}/${anio}|"></strong></p>
                
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/budget/limits}" th:object="${form}" method="post">
                    <input th:replace="~{fragments/layout :: csrf}"/>
                    
                    <div class="form-group">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{category}" class="form-control">
                            <option value="">Seleccione una categoría...</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="form-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Límite máximo ($)</label>
                        <input type="number" th:field="*{limitAmount}" class="form-control" step="0.01">
                        <span th:if="${#fields.hasErrors('limitAmount')}" th:errors="*{limitAmount}" class="form-error"></span>
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar Límite</button>
                        <a th:href="@{/budget}" class="btn btn-outline">Volver</a>
                    </div>
                </form>
            </div>
        </main-content>
    </div>
</body>
</html>
