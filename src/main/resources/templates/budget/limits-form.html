<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Límites por Categoría</title></head>
<body>
  <h1>Definir Límite por Categoría</h1>
  <p>Presupuesto de <span th:text="${mes}"></span>/<span th:text="${anio}"></span></p>
  <p th:if="${error}" th:text="${error}" style="color: red;"></p>

  <form th:action="@{/budget/limits}" th:object="${form}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label>Categoría: 
      <select th:field="*{category}">
        <option value="">Seleccione...</option>
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
      </select>
    </label><br><br>

    <label>Límite máximo: 
      <input th:field="*{limitAmount}" type="number" step="0.01"/>
    </label><br><br>

    <button type="submit">Guardar Límite</button>
    <a th:href="@{/budget}">Volver al Presupuesto</a>
  </form>
</body>
</html>
