<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nueva Meta')}"></head>
<body>
    <div th:replace="~{fragments/layout :: layout('Crear Meta de Ahorro', ~{::main-content})}">
        <main-content>
            <div class="card" style="max-width: 600px;">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <form th:action="@{/goals/new}" th:object="${form}" method="post">
                    <input th:replace="~{fragments/layout :: csrf}"/>
                    
                    <div class="form-group">
                        <label class="form-label">Nombre de la meta</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Ej: Viaje, Celular, Fondo de emergencia" required>
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Monto Objetivo ($)</label>
                        <input type="number" th:field="*{targetAmount}" class="form-control" step="0.01" required>
                        <span th:if="${#fields.hasErrors('targetAmount')}" th:errors="*{targetAmount}" class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Fecha límite (Opcional)</label>
                        <input type="date" th:field="*{deadline}" class="form-control">
                    </div>

                    <div class="flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar Meta</button>
                        <a th:href="@{/goals}" class="btn btn-outline">Cancelar</a>
                    </div>
                </form>
            </div>
        </main-content>
    </div>
</body>
</html>
