<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
    <div class="auth-wrapper" style="background: var(--bg-body);">
        <div class="auth-card text-center" style="border-top: 4px solid var(--color-danger);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-danger)" stroke-width="2" style="margin-bottom: 1rem;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <h2 style="color: var(--color-danger);">Ha ocurrido un problema</h2>
            <p class="text-muted mb-4" th:text="${status + ' - ' + error}">Error inesperado</p>
            <a th:href="@{/dashboard}" class="btn btn-primary">Volver al Dashboard</a>
        </div>
    </div>
</body>
</html>
